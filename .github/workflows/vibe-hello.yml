name: Vibe Hello - 오늘의 한마디

on:
  schedule:
    # 매일 아침 9시(KST, UTC+9) = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pick a random quote
        id: quote
        run: |
          QUOTE=$(shuf -n 1 quotes.txt)
          echo "text=$QUOTE" >> "$GITHUB_OUTPUT"

      - name: Update README quote section
        run: |
          python3 <<'EOF'
          import os
          import re

          quote = os.environ["QUOTE_TEXT"]

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              r"(<!-- QUOTE:START -->\n)(.*?)(\n<!-- QUOTE:END -->)",
              re.DOTALL,
          )
          new_content = pattern.sub(lambda m: m.group(1) + quote + m.group(3), content, count=1)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          EOF
        env:
          QUOTE_TEXT: ${{ steps.quote.outputs.text }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: 오늘의 한마디 갱신"
          git push
