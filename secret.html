<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 메모장 🔒 | My Pastel Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Pretendard:wght@300;400;600;700;800&family=Gaegu:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = localStorage.getItem('vibecoding_theme');
      if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .lock-screen {
      max-width: 360px;
      margin: 60px auto;
      text-align: center;
    }

    .lock-screen input {
      text-align: center;
      letter-spacing: 4px;
      font-size: 20px;
    }

    .lock-error {
      min-height: 20px;
      color: #ef4444;
      font-size: 13px;
      font-weight: 600;
    }

    #memoApp {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Floating Background Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">

    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <a class="logo-badge" href="hello.html" style="text-decoration: none; color: inherit;">
        <span>🏠</span>
        <span>My Pastel Space</span>
      </a>

      <div class="theme-picker" title="테마 색상 변경">
        <span style="font-size: 12px; color: var(--text-sub); margin-right: 4px; font-weight: 600;">Theme:</span>
        <div class="theme-dot active" data-theme-value="default" style="background: #c084fc;"
          onclick="setTheme('default', this)" title="소프트 라벤더"></div>
        <div class="theme-dot" data-theme-value="pink" style="background: #ff8fa3;" onclick="setTheme('pink', this)"
          title="로맨틱 핑크"></div>
        <div class="theme-dot" data-theme-value="mint" style="background: #2dd4bf;" onclick="setTheme('mint', this)"
          title="민트 브리즈"></div>
        <div class="theme-dot" data-theme-value="sunset" style="background: #fb923c;"
          onclick="setTheme('sunset', this)" title="웜 선셋"></div>
      </div>
    </header>

    <p style="text-align:center; font-size: 12px; color: var(--text-sub); margin-top: -8px;">
      ⚠️ 보안 수업 실습용 페이지입니다. 일부러 취약한 코드가 3곳 포함되어 있어요.
    </p>

    <!-- Lock Screen -->
    <section id="lockScreen" class="lock-screen">
      <div class="interactive-card">
        <div class="section-title" style="justify-content: center; margin-bottom: 0;">
          <span class="icon">🔒</span>
          <span>비밀 메모장</span>
        </div>
        <p style="font-size: 14px; color: var(--text-sub);">비밀번호를 입력하세요</p>
        <input id="passwordInput" class="custom-input" type="password" maxlength="10" placeholder="••••" />
        <div class="lock-error" id="lockError"></div>
        <button type="button" class="btn btn-primary" style="width: 100%; margin-top: 8px;"
          onclick="checkPassword()">잠금 해제</button>
      </div>
    </section>

    <!-- Memo App (unlocked after password check) -->
    <section id="memoApp">
      <div class="interactive-card">
        <div class="section-title" style="margin-bottom: 0;">
          <span class="icon">📝</span>
          <span>나만의 비밀 메모</span>
        </div>

        <form class="input-group" onsubmit="addMemo(event)">
          <textarea id="memoInput" class="custom-input" rows="3" placeholder="메모를 입력하세요" required
            style="resize: vertical; min-width: 0;"></textarea>
          <button type="submit" class="btn btn-primary" style="align-self: flex-end;">
            <span>저장</span>
          </button>
        </form>

        <div class="messages-list" id="memoContainer"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>© 2026 Jimin's Pastel Portfolio • Built with Passion & Vibe Coding 🌷</p>
    </footer>

  </div>

  <script src="script.js"></script>
  <script>
    // ⚠️ 보안 취약점 실습 페이지 (secret.html)
    // 아래 3가지는 실습을 위해 "일부러" 넣은 위험한 코드입니다.
    // 다음 시간에 스스로 문제를 찾아 고치는 것이 목표이므로 미리 고치지 마세요!

    const MEMO_KEY = 'vibecoding_secretMemo';

    // ① 취약점: 비밀번호를 코드에 하드코딩 (누구나 '보기 > 소스'로 확인 가능)
    const SECRET_PASSWORD = '1234';

    function checkPassword() {
      const input = document.getElementById('passwordInput');
      const errorBox = document.getElementById('lockError');
      const isCorrect = input.value === SECRET_PASSWORD;

      // ③ 취약점: 비밀번호 확인 결과(및 시도값)를 콘솔에 그대로 출력
      console.log('비밀번호 확인 시도:', input.value, '결과:', isCorrect);

      if (isCorrect) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('memoApp').style.display = 'block';
        renderMemos();
      } else {
        errorBox.textContent = '비밀번호가 틀렸습니다 😢';
        input.value = '';
      }
    }

    function renderMemos() {
      const memos = loadJSON(MEMO_KEY, []);
      const container = document.getElementById('memoContainer');
      container.innerHTML = '';

      if (memos.length === 0) {
        container.innerHTML = '<p style="font-size: 13px; color: var(--text-sub); text-align: center; padding: 12px 0;">아직 작성된 메모가 없어요 🌱</p>';
        return;
      }

      memos.forEach(memo => {
        const item = document.createElement('div');
        item.className = 'message-item';
        // ② 취약점: 사용자가 입력한 메모를 escape 없이 innerHTML로 그대로 삽입 (XSS)
        item.innerHTML = `
          <span class="message-text">${memo.text}</span>
          <span class="message-time">${memo.time}</span>
        `;
        container.appendChild(item);
      });
    }

    function addMemo(event) {
      event.preventDefault();
      const textInput = document.getElementById('memoInput');
      const text = textInput.value.trim();
      if (!text) return;

      const time = new Date().toLocaleString('ko-KR', {
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      });

      const memos = loadJSON(MEMO_KEY, []);
      memos.unshift({ text, time });
      saveState(MEMO_KEY, memos);

      textInput.value = '';
      renderMemos();
    }

    initThemeDots();
  </script>
</body>

</html>
